{{ define "main" }}
<div class="prose-container" style="padding-top: var(--snice-spacing-3xl); padding-bottom: var(--snice-spacing-4xl);">
  <header style="margin-bottom: var(--snice-spacing-2xl);">
    <h1 style="font-size: 2.5rem; font-weight: 800; letter-spacing: var(--snice-tracking-tight); margin-bottom: var(--snice-spacing-xs); color: var(--snice-color-text);">{{ .Title }}</h1>
    {{ with .Description }}
    <p style="font-size: 1.125rem; color: var(--snice-color-text-secondary);">{{ . }}</p>
    {{ end }}
  </header>

  <div class="article-content" style="margin-bottom: var(--snice-spacing-3xl);">
    {{ .Content }}
  </div>

  {{ if gt (len .Pages) 0 }}
  <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: var(--snice-spacing-md); color: var(--snice-color-text);">All Presentations</h2>
  <div class="post-feed" style="display: flex; flex-direction: column; gap: var(--snice-spacing-md);">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" style="text-decoration: none; color: inherit; display: block;">
      <snice-card variant="bordered" clickable>
        <div class="card-inner" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h3 style="margin-bottom: var(--snice-spacing-2xs); font-size: 1.15rem;">{{ .Title }}</h3>
            <span style="font-size: 0.85rem; color: var(--snice-color-text-secondary);">Interactive Reveal.js Slide Deck</span>
          </div>
          <snice-button variant="outline" size="small">Launch Fullscreen →</snice-button>
        </div>
      </snice-card>
    </a>
    {{ end }}
  </div>
  {{ end }}
</div>
{{ end }}
