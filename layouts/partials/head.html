<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }} — {{ site.Params.description }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">

<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">

<!-- Snice Design System & Theme (Vendored locally) -->
<link rel="stylesheet" href="/vendor/snice/theme.css">

{{ $css := resources.Get "css/style.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">

<!-- Web Components (Vendored locally, zero CDN runtime dependency) -->
<script src="/vendor/snice/snice-runtime.min.js"></script>
<script async src="/vendor/snice/snice-badge.min.js"></script>
<script async src="/vendor/snice/snice-button.min.js"></script>
<script async src="/vendor/snice/snice-card.min.js"></script>
<script async src="/vendor/snice/snice-tag.min.js"></script>
<script async src="/vendor/snice/snice-terminal.min.js"></script>
