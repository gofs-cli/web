{{ $src := .Get "src" | default (.Get 0) }}
{{ $title := .Get "title" | default "Slide Presentation" }}
<div class="reveal-embed-wrapper" style="margin: var(--snice-spacing-2xl) 0;">
  <div style="position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--snice-border-radius-lg); overflow: hidden; border: 1px solid var(--snice-color-border); background: #191919; box-shadow: var(--snice-shadow-lg);">
    <iframe src="{{ $src }}?embedded=true" title="{{ $title }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" allowfullscreen allow="fullscreen"></iframe>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: var(--snice-spacing-sm); font-size: 0.85rem; color: var(--snice-color-text-secondary); flex-wrap: wrap; gap: 0.5rem;">
    <span>💡 <em>Click inside the presentation and use <kbd style="background:var(--snice-color-surface-container);padding:0.15rem 0.4rem;border-radius:4px;border:1px solid var(--snice-color-border)">Space</kbd> or arrow keys to navigate.</em></span>
    <a href="{{ $src }}" target="_blank" rel="noopener noreferrer" style="color: var(--snice-color-text); text-decoration: none;">
      <snice-button variant="outline" size="small">Open Fullscreen ↗</snice-button>
    </a>
  </div>
</div>
