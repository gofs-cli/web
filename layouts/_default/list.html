{{ define "main" }}
<div class="prose-container" style="padding-top: var(--snice-spacing-3xl); padding-bottom: var(--snice-spacing-4xl);">
  <header style="margin-bottom: var(--snice-spacing-2xl);">
    <h1 style="font-size: 2.5rem; font-weight: 800; letter-spacing: var(--snice-tracking-tight); margin-bottom: var(--snice-spacing-xs); color: var(--snice-color-text);">{{ .Title }}</h1>
    {{ with .Description }}
    <p style="font-size: 1.125rem; color: var(--snice-color-text-secondary);">{{ . }}</p>
    {{ end }}
  </header>

  <div class="post-feed">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" style="text-decoration: none; color: inherit; display: block;">
      <snice-card variant="bordered" clickable>
        <div class="card-inner">
          <h2 class="post-title" style="margin-bottom: var(--snice-spacing-xs);">{{ .Title }}</h2>
          <p class="post-summary">{{ .Summary | plainify | truncate 180 }}</p>
        </div>
      </snice-card>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
